name: App Nativa (Appium Android)
run-name: "App Nativa Android — ${{ inputs.filtro != '' && inputs.filtro || 'suite completa' }} por @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      filtro:
        description: "Opcional: expresión -k de pytest para correr solo algunos casos (ej: test_01 or test_03)"
        required: false
        type: string
        default: ""
      apk:
        description: "Opcional: nombre del .apk dentro de la carpeta de APKs a usar (si no se indica, se usa el más reciente)"
        required: false
        type: string
        default: ""

env:
  PYTHONUNBUFFERED: "1"
  CI: "true"
  # Carpeta donde se copian los .apk a mano en este runner. Es la misma carpeta que usa
  # correr.ps1 para las corridas manuales (D:\Artear\Mobile\appium-native-app-qa\apks) --
  # NO la carpeta apks\ del checkout de este job, que siempre está vacía (gitignored).
  CARPETA_APKS: "D:\\Artear\\Mobile\\appium-native-app-qa\\apks"

permissions:
  contents: write

jobs:
  correr-suite:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        working-directory: appium-native-app-qa
    steps:
      - uses: actions/checkout@v4

      - name: Crear entorno virtual e instalar dependencias
        shell: powershell
        run: |
          py -m venv .venv
          .\.venv\Scripts\pip install -r requirements.txt

      - name: Detectar dispositivo Android conectado
        shell: powershell
        run: |
          $linea = adb devices | Select-String "`tdevice$" | Select-Object -First 1
          if (-not $linea) {
            Write-Host "No hay ningún Android conectado. Revisá el cable y la depuración USB." -ForegroundColor Red
            exit 1
          }
          $udid = ($linea.ToString() -split "`t")[0]
          Write-Host "Dispositivo detectado: $udid"
          echo "ANDROID_UDID=$udid" >> $env:GITHUB_ENV

      - name: Ubicar el APK a probar
        shell: powershell
        run: |
          $apkInput = "${{ inputs.apk }}"
          if (-not (Test-Path $env:CARPETA_APKS)) {
            Write-Host "::error::No existe la carpeta $env:CARPETA_APKS en este runner."
            exit 1
          }
          if ($apkInput) {
            $ruta = Join-Path $env:CARPETA_APKS $apkInput
            if (-not (Test-Path $ruta)) {
              Write-Host "::error::No existe $apkInput dentro de $env:CARPETA_APKS. Copialo ahí antes de disparar la corrida."
              exit 1
            }
          } else {
            $ultimo = Get-ChildItem (Join-Path $env:CARPETA_APKS "*.apk") -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
            if (-not $ultimo) {
              Write-Host "::error::No hay ningún .apk en $env:CARPETA_APKS. Copiá ahí el APK a probar antes de disparar la corrida."
              exit 1
            }
            $ruta = $ultimo.FullName
          }
          Write-Host "APK: $ruta"
          echo "TN_APP=$((Resolve-Path $ruta).Path)" >> $env:GITHUB_ENV

      - name: Iniciar Appium
        shell: powershell
        run: |
          $npmBin = Join-Path $env:APPDATA "npm"
          if ($env:Path -notlike "*$npmBin*") { $env:Path += ";$npmBin" }
          Start-Process appium.cmd -ArgumentList "--allow-insecure=uiautomator2:chromedriver_autodownload", "--log", "appium.log" -WindowStyle Hidden
          $limite = (Get-Date).AddSeconds(40)
          $listo = $false
          while (-not $listo) {
            try {
              $c = [Net.Sockets.TcpClient]::new(); $c.Connect("127.0.0.1", 4723); $c.Close(); $listo = $true
            } catch {
              if ((Get-Date) -gt $limite) { Write-Host "Appium no arrancó a tiempo" -ForegroundColor Red; exit 1 }
              Start-Sleep -Seconds 1
            }
          }

      - name: Correr suite
        shell: powershell
        run: |
          $pyArgs = @("-m", "pytest")
          if ("${{ inputs.filtro }}") { $pyArgs += @("-k", "${{ inputs.filtro }}") }
          & .\.venv\Scripts\python.exe @pyArgs 2>&1 | Tee-Object -FilePath pytest_output.log
          $ec = $LASTEXITCODE
          if ($ec -ne 0) {
            $tail = ((Get-Content pytest_output.log -Tail 60) -join " | ") -replace "%", "%25" -replace "`r", "" -replace "`n", " | "
            Write-Host "::error::pytest fallo (exit $ec): $tail"
          }
          exit $ec

      - name: Detener Appium
        if: always()
        shell: powershell
        run: |
          Get-Process appium -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*appium*" } | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Subir resultados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-appnativa-android-${{ github.run_id }}
          path: appium-native-app-qa/resultados/android/
          retention-days: 30
          if-no-files-found: error

      - name: Publicar reporte (rama reportes-appnativa-android)
        if: always()
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          # git escribe mensajes normales (ej. "no existe esa rama todavía") a stderr, y con
          # $ErrorActionPreference = Stop (default de este shell) PowerShell los toma como
          # excepción fatal y corta el script. Lo evitamos con Continue para este step.
          $ErrorActionPreference = "Continue"

          $ultimaCorrida = Get-ChildItem "appium-native-app-qa\resultados\android\corridas" -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $ultimaCorrida -or -not (Test-Path (Join-Path $ultimaCorrida.FullName "reporte.html"))) {
            Write-Host "No hay reporte.html para publicar (la corrida no llegó a generarlo)."
            exit 0
          }

          $rama = "reportes-appnativa-android"
          $raizReportes = "reportes/appnativa/android"
          $raizRuns = "$raizReportes/runs"
          # Cada corrida queda en su propia carpeta (antes se pisaba siempre la misma
          # reportes/appnativa/android/reporte.html, así que el dashboard solo podía
          # mostrar la última) -- así se puede listar el reporte de cada corrida, no
          # nada más el más reciente. Para que la rama no crezca sin límite (sobre todo
          # por los videos de evidencia), nos quedamos solo con las últimas corridas.
          $maxCorridasGuardadas = 10

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin $rama 2>$null
          if ($LASTEXITCODE -eq 0) {
            git checkout -B $rama "origin/$rama"
          } else {
            git checkout --orphan $rama
            git rm -rf . --quiet 2>$null
          }

          $destino = "$raizRuns/${{ github.run_id }}"
          New-Item -ItemType Directory -Path $destino -Force | Out-Null
          Copy-Item (Join-Path $ultimaCorrida.FullName "reporte.html") $destino
          $evidencias = Join-Path $ultimaCorrida.FullName "evidencias"
          if (Test-Path $evidencias) {
            Copy-Item $evidencias (Join-Path $destino "evidencias") -Recurse
          }

          # meta.json con el .apk probado (lo guarda la fixture "app" en resultados.json,
          # bajo _sesion.detalle.app) -- el dashboard lo usa para mostrar el ticket (ej.
          # "AMR-2087") como nombre de cada reporte publicado, en vez del filtro -k crudo
          # del run de Actions.
          try {
            $resultadosJson = Get-Content (Join-Path $ultimaCorrida.FullName "resultados.json") -Raw -ErrorAction Stop | ConvertFrom-Json
            $apk = $resultadosJson._sesion.detalle.app
            if ($apk) {
              @{ apk = $apk } | ConvertTo-Json -Compress | Set-Content (Join-Path $destino "meta.json") -Encoding utf8
            }
          } catch {
            Write-Host "No se pudo armar meta.json (no es grave, el dashboard tiene un fallback): $($_.Exception.Message)"
          }

          # Reporte de antes de este cambio, publicado directo en $raizReportes sin
          # carpeta por corrida -- se saca para no dejarlo mezclado y desactualizado.
          if (Test-Path (Join-Path $raizReportes "reporte.html")) {
            git rm -f --quiet -- "$raizReportes/reporte.html" 2>$null
          }
          if (Test-Path (Join-Path $raizReportes "evidencias")) {
            git rm -rf --quiet -- "$raizReportes/evidencias" 2>$null
          }

          # Poda: nos quedamos con las $maxCorridasGuardadas carpetas de corrida más
          # recientes (el nombre de cada carpeta es el run id, siempre creciente).
          if (Test-Path $raizRuns) {
            $carpetas = Get-ChildItem $raizRuns -Directory | Sort-Object { [int64]$_.Name } -Descending
            $carpetas | Select-Object -Skip $maxCorridasGuardadas | ForEach-Object {
              git rm -rf --quiet -- "$raizRuns/$($_.Name)" 2>$null
            }
          }

          git add -A -- $raizReportes
          $huboCambios = (git status --porcelain) -ne $null
          if ($huboCambios) {
            git commit -m "Reporte App Nativa Android - run ${{ github.run_id }}" | Out-Null
            git push origin $rama --force
            Write-Host "Reporte publicado en la rama $rama"
          } else {
            Write-Host "El reporte no cambió, nada que publicar"
          }

          git checkout main
