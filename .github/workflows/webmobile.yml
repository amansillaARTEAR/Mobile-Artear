name: WebMobile (Appium Android)
run-name: "WebMobile Android — ${{ inputs.filtro != '' && inputs.filtro || 'suite completa' }} por @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      filtro:
        description: "Opcional: expresión -k de pytest para correr solo algunos casos (ej: ca03 or ca07)"
        required: false
        type: string
        default: ""
      ambiente:
        description: "Ambiente de TN a probar. SBX no usa versión; DEV y VNP la necesitan en 'version'."
        required: false
        type: choice
        options: ["sbx", "dev", "vnp"]
        default: "sbx"
      version:
        description: "Número de versión promovida (ej: 721) -- requerido si ambiente es DEV o VNP, se ignora en SBX"
        required: false
        type: string
        default: ""

env:
  PYTHONUNBUFFERED: "1"

permissions:
  contents: write

jobs:
  correr-suite:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        working-directory: appium-mobile-web-qa
    steps:
      - uses: actions/checkout@v4

      - name: Crear entorno virtual e instalar dependencias
        shell: powershell
        run: |
          py -m venv .venv
          .\.venv\Scripts\pip install -r requirements.txt

      - name: Detectar dispositivo Android conectado
        shell: powershell
        run: |
          $linea = adb devices | Select-String "`tdevice$" | Select-Object -First 1
          if (-not $linea) {
            Write-Host "No hay ningún Android conectado. Revisá el cable y la depuración USB." -ForegroundColor Red
            exit 1
          }
          $udid = ($linea.ToString() -split "`t")[0]
          Write-Host "Dispositivo detectado: $udid"
          echo "ANDROID_UDID=$udid" >> $env:GITHUB_ENV

      - name: Iniciar Appium
        shell: powershell
        run: |
          $npmBin = Join-Path $env:APPDATA "npm"
          if ($env:Path -notlike "*$npmBin*") { $env:Path += ";$npmBin" }
          Start-Process appium.cmd -ArgumentList "--allow-insecure=uiautomator2:chromedriver_autodownload", "--log", "appium.log" -WindowStyle Hidden
          $limite = (Get-Date).AddSeconds(40)
          $listo = $false
          while (-not $listo) {
            try {
              $c = [Net.Sockets.TcpClient]::new(); $c.Connect("127.0.0.1", 4723); $c.Close(); $listo = $true
            } catch {
              if ((Get-Date) -gt $limite) { Write-Host "Appium no arrancó a tiempo" -ForegroundColor Red; exit 1 }
              Start-Sleep -Seconds 1
            }
          }

      - name: Armar URL del ambiente
        shell: powershell
        run: |
          $ambiente = "${{ inputs.ambiente }}"
          if (-not $ambiente) { $ambiente = "sbx" }
          $version = "${{ inputs.version }}"
          switch ($ambiente) {
            "dev" { $dominio = "artear-tn-dev.cdn.arcpublishing.com" }
            "sbx" { $dominio = "artear-tn-sandbox.cdn.arcpublishing.com" }
            "vnp" { $dominio = "tn.com.ar" }
            default { Write-Host "::error::Ambiente desconocido: $ambiente (esperaba dev/sbx/vnp)"; exit 1 }
          }
          $ruta = "/shorts/player/videos/test-section/2025/12/19/videolab-collection-8/"
          if ($ambiente -eq "sbx") {
            $tnUrl = "https://$dominio$ruta"
          } else {
            if (-not $version) {
              Write-Host "::error::El ambiente '$ambiente' necesita el input 'version' (ej: 721)"
              exit 1
            }
            $tnUrl = "https://$dominio$ruta?d=$version"
          }
          Write-Host "Ambiente: $ambiente -> TN_URL: $tnUrl"
          echo "TN_URL=$tnUrl" >> $env:GITHUB_ENV

      - name: Correr suite
        shell: powershell
        run: |
          $pyArgs = @("-m", "pytest", "--plataforma", "android")
          if ("${{ inputs.filtro }}") { $pyArgs += @("-k", "${{ inputs.filtro }}") }
          & .\.venv\Scripts\python.exe @pyArgs 2>&1 | Tee-Object -FilePath pytest_output.log
          $ec = $LASTEXITCODE
          if ($ec -ne 0) {
            $tail = ((Get-Content pytest_output.log -Tail 60) -join " | ") -replace "%", "%25" -replace "`r", "" -replace "`n", " | "
            Write-Host "::error::pytest fallo (exit $ec): $tail"
          }
          exit $ec

      - name: Detener Appium
        if: always()
        shell: powershell
        run: |
          Get-Process appium -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*appium*" } | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Subir resultados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-webmobile-android-${{ github.run_id }}
          # Solo la carpeta de Android: "resultados/" también tiene corridas viejas de iOS
          # (de pruebas locales), y este workflow no debe mezclarlas en su artifact.
          path: appium-mobile-web-qa/resultados/android/
          retention-days: 30
          if-no-files-found: error

      - name: Publicar reporte (rama reportes-webmobile-android)
        if: always()
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          # Mismo patrón que app-nativa.yml: sin esto, la única forma de ver el reporte o las
          # capturas de una corrida de WebMobile es el artifact de Actions (descarga por Azure
          # Blob, bloqueada para el agente) -- publicando en una rama queda accesible también
          # vía la API de contenidos de GitHub (que sí está permitida).
          $ErrorActionPreference = "Continue"

          $ultimaCorrida = Get-ChildItem "appium-mobile-web-qa\resultados\android\corridas" -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $ultimaCorrida -or -not (Test-Path (Join-Path $ultimaCorrida.FullName "reporte.html"))) {
            Write-Host "No hay reporte.html para publicar (la corrida no llegó a generarlo)."
            exit 0
          }

          $rama = "reportes-webmobile-android"
          $raizReportes = "reportes/webmobile/android"
          $raizRuns = "$raizReportes/runs"
          $maxCorridasGuardadas = 10

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin $rama 2>$null
          if ($LASTEXITCODE -eq 0) {
            git checkout -B $rama "origin/$rama"
          } else {
            git checkout --orphan $rama
            git rm -rf . --quiet 2>$null
          }

          $destino = "$raizRuns/${{ github.run_id }}"
          New-Item -ItemType Directory -Path $destino -Force | Out-Null
          Copy-Item (Join-Path $ultimaCorrida.FullName "reporte.html") $destino
          $evidencias = Join-Path $ultimaCorrida.FullName "evidencias"
          if (Test-Path $evidencias) {
            Copy-Item $evidencias (Join-Path $destino "evidencias") -Recurse
          }

          try {
            $resultadosJson = Get-Content (Join-Path $ultimaCorrida.FullName "resultados.json") -Raw -ErrorAction Stop | ConvertFrom-Json
            @{ ambiente = "${{ inputs.ambiente }}"; version = "${{ inputs.version }}"; filtro = "${{ inputs.filtro }}" } |
              ConvertTo-Json -Compress | Set-Content (Join-Path $destino "meta.json") -Encoding utf8
          } catch {
            Write-Host "No se pudo armar meta.json (no es grave): $($_.Exception.Message)"
          }

          if (Test-Path $raizRuns) {
            $carpetas = Get-ChildItem $raizRuns -Directory | Sort-Object { [int64]$_.Name } -Descending
            $carpetas | Select-Object -Skip $maxCorridasGuardadas | ForEach-Object {
              git rm -rf --quiet -- "$raizRuns/$($_.Name)" 2>$null
            }
          }

          git add -A -- $raizReportes
          $huboCambios = (git status --porcelain) -ne $null
          if ($huboCambios) {
            git commit -m "Reporte WebMobile Android - run ${{ github.run_id }}" | Out-Null
            git push origin $rama --force
            Write-Host "Reporte publicado en la rama $rama"
          } else {
            Write-Host "El reporte no cambió, nada que publicar"
          }

          git checkout main